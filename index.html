<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Social</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 1.2rem;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .notice {
      color: #cbd5e1;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 1px;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .secondary-button {
      margin-top: 8px;
      background: #334155;
    }

    .secondary-button:hover {
      background: #475569;
    }

    .status {
      min-height: 1.3em;
      margin-top: 8px;
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }

    .post {
      border-bottom: 1px solid #334155;
      padding: 12px 0;
    }

    .post:last-child {
      border-bottom: none;
    }

    .post-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .meta {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 6px;
    }

    .empty-feed {
      color: #94a3b8;
      padding: 12px 0;
    }

    footer {
      text-align: center;
      padding: 16px 0;
      color: #64748b;
      font-size: 0.85rem;
    }

    footer a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">GitHub Social</h1>
      <p class="notice">
        Public social feed hosted on GitHub Pages. Feed updates automatically from <code>posts.json</code>.
      </p>

      <button type="button" id="load-button">
        🔄 Refresh Feed
      </button>
      <p id="setup-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="new-post-heading">
      <h2 id="new-post-heading">📝 New Post</h2>

      <label for="author">Your name</label>
      <input
        type="text"
        id="author"
        placeholder="Your name (optional)"
        maxlength="80"
      >

      <label for="content">Post</label>
      <textarea
        id="content"
        rows="3"
        placeholder="What's happening?"
        maxlength="5000"
      ></textarea>

      <label for="pat">Access Token (for direct posting)</label>
      <input
        type="password"
        id="pat"
        placeholder="GitHub Token / Action Key"
        autocomplete="off"
      >

      <button type="button" id="publish-button">Publish post</button>
      <p id="post-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="feed-heading">
      <h2 id="feed-heading">💬 Feed</h2>
      <div id="feed" aria-live="polite">
        <p class="empty-feed">Loading feed…</p>
      </div>
    </section>

    <footer>
      Clifford Ray Hackett · <a href="mailto:crh2509@icloud.com">crh2509@icloud.com</a> · 671-IKNOWME
    </footer>
  </main>

  <script>
    "use strict";

    const OWNER = "ram133";
    const REPO = "social";

    const elements = {
      pat: document.getElementById("pat"),
      author: document.getElementById("author"),
      content: document.getElementById("content"),
      feed: document.getElementById("feed"),
      setupStatus: document.getElementById("setup-status"),
      postStatus: document.getElementById("post-status"),
      loadButton: document.getElementById("load-button"),
      publishButton: document.getElementById("publish-button")
    };

    function setStatus(element, message, color = "#38bdf8") {
      element.textContent = message;
      element.style.color = color;
    }

    function setBusy(button, busy, busyText, idleText) {
      button.disabled = busy;
      button.textContent = busy ? busyText : idleText;
    }

    function renderFeed(posts) {
      elements.feed.replaceChildren();

      if (!Array.isArray(posts) || posts.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-feed";
        empty.textContent = "No posts yet.";
        elements.feed.appendChild(empty);
        return;
      }

      for (const post of posts) {
        const article = document.createElement("article");
        article.className = "post";

        const content = document.createElement("p");
        content.className = "post-content";
        content.textContent = typeof post.content === "string" ? post.content : "";

        const meta = document.createElement("p");
        meta.className = "meta";

        const author = typeof post.author === "string" && post.author.trim()
          ? post.author
          : "Anonymous";

        let dateText = "";
        if (typeof post.timestamp === "string") {
          const date = new Date(post.timestamp);
          if (!Number.isNaN(date.getTime())) {
            dateText = date.toLocaleString();
          }
        }

        meta.textContent = dateText ? `${author} · ${dateText}` : author;
        article.append(content, meta);
        elements.feed.appendChild(article);
      }
    }

    async function loadFeed() {
      setBusy(elements.loadButton, true, "Loading…", "🔄 Refresh Feed");
      setStatus(elements.setupStatus, "Fetching latest posts…");

      try {
        // Fetch raw posts.json directly from GitHub Pages or API without token
        const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/posts.json?t=${Date.now()}`);
        if (!res.ok) {
          throw new Error(`Could not load posts.json (${res.status})`);
        }
        const posts = await res.json();
        renderFeed(posts);
        setStatus(elements.setupStatus, "Feed updated.", "#22c55e");
      } catch (error) {
        setStatus(elements.setupStatus, `Error loading feed: ${error.message}`, "#ef4444");
      } finally {
        setBusy(elements.loadButton, false, "", "🔄 Refresh Feed");
      }
    }

    async function submitPost() {
      const author = elements.author.value.trim() || "Anonymous";
      const content = elements.content.value.trim();
      const token = elements.pat.value.trim();

      if (!content) {
        setStatus(elements.postStatus, "Please write a post before publishing.", "#ef4444");
        return;
      }

      if (!token) {
        setStatus(elements.postStatus, "Enter access token to submit post.", "#ef4444");
        return;
      }

      setBusy(elements.publishButton, true, "Publishing…", "Publish post");
      setStatus(elements.postStatus, "Triggering GitHub Action workflow…");

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/dispatches`, {
          method: "POST",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            event_type: "add_post",
            client_payload: {
              author: author,
              content: content
            }
          })
        });

        if (!response.ok) {
          throw new Error(`GitHub Action trigger failed (${response.status})`);
        }

        elements.content.value = "";
        setStatus(elements.postStatus, "Post submitted! GitHub Action is processing build...", "#22c55e");
        setTimeout(loadFeed, 5000);
      } catch (error) {
        setStatus(elements.postStatus, `Error: ${error.message}`, "#ef4444");
      } finally {
        setBusy(elements.publishButton, false, "", "Publish post");
      }
    }

    elements.loadButton.addEventListener("click", loadFeed);
    elements.publishButton.addEventListener("click", submitPost);

    // Initial load
    loadFeed();
  </script>
</body>
</html>
