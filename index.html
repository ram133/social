<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Social</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 1.2rem;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .notice {
      color: #cbd5e1;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    input:focus,
    textarea:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 1px;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0369a1;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .secondary-button {
      margin-top: 8px;
      background: #334155;
    }

    .secondary-button:hover {
      background: #475569;
    }

    .status {
      min-height: 1.3em;
      margin-top: 8px;
      font-size: 0.9rem;
      overflow-wrap: anywhere;
    }

    .post {
      border-bottom: 1px solid #334155;
      padding: 12px 0;
    }

    .post:last-child {
      border-bottom: none;
    }

    .post-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .meta {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 6px;
    }

    .empty-feed {
      color: #94a3b8;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">GitHub Social</h1>
      <p class="notice">
        For local or private testing only. A token entered here is available to
        this page and should not be used on a public website.
      </p>

      <h2>⚙️ Setup</h2>
      <label for="owner">GitHub owner</label>
      <input
        type="text"
        id="owner"
        placeholder="Username or organization"
        autocomplete="off"
      >

      <label for="repo">Repository name</label>
      <input
        type="text"
        id="repo"
        placeholder="Repository name"
        autocomplete="off"
      >

      <label for="pat">Personal access token</label>
      <input
        type="password"
        id="pat"
        placeholder="Token with repository Contents access"
        autocomplete="off"
      >

      <button type="button" id="initialize-button">
        Create posts.json if missing
      </button>
      <button type="button" id="load-button" class="secondary-button">
        Load feed
      </button>
      <p id="setup-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="new-post-heading">
      <h2 id="new-post-heading">📝 New Post</h2>

      <label for="author">Your name</label>
      <input
        type="text"
        id="author"
        placeholder="Your name (optional)"
        maxlength="80"
      >

      <label for="content">Post</label>
      <textarea
        id="content"
        rows="3"
        placeholder="What's happening?"
        maxlength="5000"
      ></textarea>

      <button type="button" id="publish-button">Publish post</button>
      <p id="post-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="feed-heading">
      <h2 id="feed-heading">💬 Feed</h2>
      <div id="feed" aria-live="polite">
        <p class="empty-feed">Enter a repository above, then load the feed.</p>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const elements = {
      owner: document.getElementById("owner"),
      repo: document.getElementById("repo"),
      pat: document.getElementById("pat"),
      author: document.getElementById("author"),
      content: document.getElementById("content"),
      feed: document.getElementById("feed"),
      setupStatus: document.getElementById("setup-status"),
      postStatus: document.getElementById("post-status"),
      initializeButton: document.getElementById("initialize-button"),
      loadButton: document.getElementById("load-button"),
      publishButton: document.getElementById("publish-button")
    };

    function getConfig() {
      return {
        owner: elements.owner.value.trim(),
        repo: elements.repo.value.trim(),
        token: elements.pat.value.trim()
      };
    }

    function setStatus(element, message, color = "#38bdf8") {
      element.textContent = message;
      element.style.color = color;
    }

    function setBusy(button, busy, busyText, idleText) {
      button.disabled = busy;
      button.textContent = busy ? busyText : idleText;
    }

    function contentsUrl(owner, repo, path = "posts.json") {
      const safeOwner = encodeURIComponent(owner);
      const safeRepo = encodeURIComponent(repo);
      const safePath = path.split("/").map(encodeURIComponent).join("/");
      return `https://api.github.com/repos/${safeOwner}/${safeRepo}/contents/${safePath}`;
    }

    function makeHeaders(token) {
      const headers = {
        Accept: "application/vnd.github+json"
      };

      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      return headers;
    }

    async function parseError(response) {
      let message = `GitHub API error (${response.status})`;

      try {
        const body = await response.json();
        if (body && body.message) {
          message = body.message;
        }
      } catch {
        // Keep the generic message if the response isn't JSON.
      }

      const error = new Error(message);
      error.status = response.status;
      return error;
    }

    async function getFileDetails(owner, repo, token) {
      const response = await fetch(contentsUrl(owner, repo), {
        headers: makeHeaders(token)
      });

      if (response.status === 404) {
        return null;
      }

      if (!response.ok) {
        throw await parseError(response);
      }

      return response.json();
    }

    function decodeFileContent(encodedContent) {
      const binary = atob(encodedContent.replace(/\s/g, ""));
      const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function encodeFileContent(value) {
      const bytes = new TextEncoder().encode(value);
      let binary = "";
      const chunkSize = 0x8000;

      for (let offset = 0; offset < bytes.length; offset += chunkSize) {
        const chunk = bytes.subarray(offset, offset + chunkSize);
        binary += String.fromCharCode(...chunk);
      }

      return btoa(binary);
    }

    function postsFromFile(file) {
      if (!file || typeof file.content !== "string") {
        throw new Error("Could not read posts.json. Make sure the file is a small JSON file.");
      }

      let posts;

      try {
        posts = JSON.parse(decodeFileContent(file.content));
      } catch {
        throw new Error("posts.json is not valid UTF-8 JSON.");
      }

      if (!Array.isArray(posts)) {
        throw new Error("posts.json must contain a JSON array.");
      }

      return posts;
    }

    async function putFile(owner, repo, token, data, sha, message) {
      const body = {
        message,
        content: encodeFileContent(JSON.stringify(data, null, 2))
      };

      if (sha) {
        body.sha = sha;
      }

      const response = await fetch(contentsUrl(owner, repo), {
        method: "PUT",
        headers: {
          ...makeHeaders(token),
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        throw await parseError(response);
      }

      return response.json();
    }

    async function initializeDatabase() {
      const { owner, repo, token } = getConfig();

      if (!owner || !repo || !token) {
        setStatus(elements.setupStatus, "Enter an owner, repository, and token.", "#ef4444");
        return;
      }

      setBusy(elements.initializeButton, true, "Checking repository…", "Create posts.json if missing");
      setStatus(elements.setupStatus, "Checking for posts.json…");

      try {
        const existingFile = await getFileDetails(owner, repo, token);

        if (existingFile) {
          setStatus(
            elements.setupStatus,
            "posts.json already exists; it was left unchanged.",
            "#22c55e"
          );
          await loadFeed();
          return;
        }

        await putFile(
          owner,
          repo,
          token,
          [],
          null,
          "Initialize posts.json"
        );

        setStatus(elements.setupStatus, "Created an empty posts.json.", "#22c55e");
        await loadFeed();
      } catch (error) {
        setStatus(elements.setupStatus, `Error: ${error.message}`, "#ef4444");
      } finally {
        setBusy(elements.initializeButton, false, "", "Create posts.json if missing");
      }
    }

    function renderFeed(posts) {
      elements.feed.replaceChildren();

      if (posts.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-feed";
        empty.textContent = "No posts yet.";
        elements.feed.appendChild(empty);
        return;
      }

      for (const post of posts) {
        const article = document.createElement("article");
        article.className = "post";

        const content = document.createElement("p");
        content.className = "post-content";
        content.textContent = typeof post.content === "string" ? post.content : "";

        const meta = document.createElement("p");
        meta.className = "meta";

        const author = typeof post.author === "string" && post.author.trim()
          ? post.author
          : "Anonymous";

        let dateText = "";
        if (typeof post.timestamp === "string") {
          const date = new Date(post.timestamp);
          if (!Number.isNaN(date.getTime())) {
            dateText = date.toLocaleString();
          }
        }

        meta.textContent = dateText ? `${author} · ${dateText}` : author;
        article.append(content, meta);
        elements.feed.appendChild(article);
      }
    }

    async function loadFeed() {
      const { owner, repo, token } = getConfig();

      if (!owner || !repo) {
        setStatus(elements.setupStatus, "Enter an owner and repository to load the feed.", "#ef4444");
        return;
      }

      elements.feed.replaceChildren();
      const loading = document.createElement("p");
      loading.className = "empty-feed";
      loading.textContent = "Loading posts…";
      elements.feed.appendChild(loading);

      setBusy(elements.loadButton, true, "Loading…", "Load feed");

      try {
        const file = await getFileDetails(owner, repo, token);

        if (!file) {
          renderFeed([]);
          setStatus(elements.setupStatus, "posts.json was not found. Create it first.", "#ef4444");
          return;
        }

        renderFeed(postsFromFile(file));
        setStatus(elements.setupStatus, "Feed loaded.", "#22c55e");
      } catch (error) {
        elements.feed.replaceChildren();
        const message = document.createElement("p");
        message.className = "empty-feed";
        message.textContent = `Could not load feed: ${error.message}`;
        elements.feed.appendChild(message);
        setStatus(elements.setupStatus, `Error: ${error.message}`, "#ef4444");
      } finally {
        setBusy(elements.loadButton, false, "", "Load feed");
      }
    }

    async function submitPost() {
      const { owner, repo, token } = getConfig();
      const author = elements.author.value.trim() || "Anonymous";
      const content = elements.content.value.trim();

      if (!owner || !repo || !token || !content) {
        setStatus(
          elements.postStatus,
          "Enter an owner, repository, token, and post content.",
          "#ef4444"
        );
        return;
      }

      setBusy(elements.publishButton, true, "Publishing…", "Publish post");
      setStatus(elements.postStatus, "Publishing post…");

      try {
        let saved = false;

        // Retry if another update changes the file SHA while publishing.
        for (let attempt = 0; attempt < 3; attempt++) {
          const file = await getFileDetails(owner, repo, token);

          if (!file) {
            throw new Error("posts.json was not found. Create it before publishing.");
          }

          const posts = postsFromFile(file);
          posts.unshift({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
            author,
            content,
            timestamp: new Date().toISOString()
          });

          try {
            await putFile(
              owner,
              repo,
              token,
              posts,
              file.sha,
              "Add social post"
            );
            saved = true;
            break;
          } catch (error) {
            const isShaConflict = error.status === 409 || error.status === 422;
            if (!isShaConflict || attempt === 2) {
              throw error;
            }
          }
        }

        if (!saved) {
          throw new Error("The post could not be saved. Please try again.");
        }

        elements.content.value = "";
        setStatus(elements.postStatus, "Post published.", "#22c55e");
        await loadFeed();
      } catch (error) {
        setStatus(elements.postStatus, `Error: ${error.message}`, "#ef4444");
      } finally {
        setBusy(elements.publishButton, false, "", "Publish post");
      }
    }

    elements.initializeButton.addEventListener("click", initializeDatabase);
    elements.loadButton.addEventListener("click", loadFeed);
    elements.publishButton.addEventListener("click", submitPost);
  </script>
</body>
</html>
